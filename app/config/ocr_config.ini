[OCR]
tesseract_path = C:\Program Files\Tesseract-OCR\tesseract.exe
tesseract_config = --psm 6 -l eng
log_dir = ./app/logs/ocr_logs

[Fields]
required_fields = parcel_id, tax_value, property_address, flood_zone, amount, bedrooms, bathrooms, year_built, mls_number

[Processing]
max_pages_to_process = 5
preprocess_images = True
detect_rotation = True
