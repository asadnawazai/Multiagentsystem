        \ TRENDS Overall, the property market in Gujranwala has experienced significant\
        \ growth, particularly in medium-sized properties which showed the highest\
        \ cumulative returns over both 8-year and 3- year periods (196% and 60% respectively).\
        \ Small properties also performed well, with a 128% cumulative return over\
        \ 8 years. Large properties, while showing lower cumulative returns than medium\
        \ properties, exhibited strong growth in recent years, with a 41% return in\
        \ 2023 and a 72% cumulative return over 3 years. This suggests a potentially\
        \ increasing interest in larger properties in Gujranwala. SOURCE: ZAMEEN.COM,\
        \ HBFC RESEARCH Sialkot, a prominent industrial city with a population of\
        \ 4.5 million, is renowned for its manufacturing prowess, particularly in\
        \ the sports goods and surgical instruments industries. The city has approximately\
        \ 672,000 households, with an average household size of 6.7. Sialkot's property\
        \ market reflects its strong economic base, with consistent growth across\
        \ all property segments and a notable surge in demand for smaller, affordable\
        \ housing options. The city's dynamic real estate landscape supports its robust\
        \ industrial sector while catering to the housing needs of its diverse and\
        \ growing population. THE RISE OF SMALL PROPERTIES: AN INSIDE STORY ON PAKISTAN'S\
        \ REAL ESTATE SECTOR SIALKOT'S REAL ESTATE MARKET: STRONG GROWTH WITH SMALL\
        \ PROPERTIES LEADING THE SURGE SIALKOT'S PROPERTY MARKET: A DECADE OF EXCEPTIONAL\
        \ GROWTH WITH A FOCUS ON SMALL PROPERTIES The property market in Sialkot has\
        \ experienced significant growth over the past three years, with small properties\
        \ leading the way. Small properties have achieved a cumulative return of 70%,\
        \ reflecting strong demand and investment potential in this segment. Medium\
        \ properties have also performed well, with a 51% cumulative return, indicating\
        \ healthy demand for mid-sized homes. Large properties, while showing the\
        \ lowest growth compared to the other segments, still posted a substantial\
        \ 47% cumulative return, underscoring steady interest in more spacious homes.\
        \ The year-by-year analysis reveals a consistent upward trend, particularly\
        \ in 2023, where small and large properties saw impressive returns of 33%\
        \ and 39%, respectively. These trends highlight Sialkot's dynamic real estate\
        \ market, driven by economic growth, rising consumer confidence, and increasing\
        \ urbanization, which are fostering demand across all property sizes. SOURCE:\
        \ ZAMEEN.COM, HBFC RESEARCH Pakistan's GDP performance over the past three\
        \ years has been varied. After a robust growth of 5.8% in FY21 and 6.2% in\
        \ FY22, the economy contracted by 0.2% in FY23. This downturn was due to a\
        \ combination of internal and external factors, including political instability,\
        \ soaring inflation, currency devaluation, catastrophic floods, and a global\
        \ economic slowdown. The agriculture sector, a significant contributor to\
        \ the GDP, was particularly hard hit by the floods, while the manufacturing\
        \ and services sectors also faced significant challenges. Government efforts\
        \ to stabilize the economy through fiscal tightening and monetary policy measures\
        \ further dampened growth. However, signs of recovery have emerged, with a\
        \ projected growth rate of 2.38% for FY24, driven by a rebound in the agriculture\
        \ sector and expected improvements in other sectors. In the third quarter\
        \ (Q3) of the fiscal year 2023-2024, GDP growth was estimated at 2.09%, indicating\
        \ a positive economic recovery compared to the contraction of the previous\
        \ year. This growth was primarily driven by higher output in the agriculture\
        \ sector. While overall economic activity remained subdued at the start of\
        \ Q3, improvements were expected in the coming months. The provisional growth\
        \ rate for the entire fiscal year ending June 2024 is estimated at 2.38%.\
        \ This modest but positive trajectory reflects the government's efforts toward\
        \ economic stabilization and recovery following a challenging period of political\
        \ unrest, inflationary pressures, and currency devaluation. Additionally,\
        \ Pakistan's per capita income showed positive growth, reaching $1,680 in\
        \ FY24, up from $1,551 in the previous year. This increase indicates progress\
        \ in economic development and potential improvements in living standards for\
        \ its citizens. The rebound in GDP is expected to have a significant positive\
        \ impact on Pakistan's real estate sector. Economic growth generally boosts\
        \ confidence among investors and consumers, leading to increased demand for\
        \ residential, commercial, and industrial properties. With the agriculture\
        \ sector's recovery, rural incomes are likely to rise, potentially driving\
        \ demand for housing and related infrastructure in rural and semi-urban areas.\
        \ Additionally, improved economic stability and higher per capita income can\
        \ enhance purchasing power, making property investments more attractive. This\
        \ upward trend in the real estate market can further stimulate economic activity,\
        \ creating a virtuous cycle of growth and development. THE RISE OF SMALL PROPERTIES:\
        \ AN INSIDE STORY ON PAKISTAN'S REAL ESTATE SECTOR RESURGENCE IN REAL ESTATE\
        \ ACTIVITY POSITIVE GDP REBOUND EXPECTED TO BOOST PAKISTAN'S REAL ESTATE SECTOR\
        \ Real estate activities, particularly the ownership of dwellings, have shown\
        \ consistent growth throughout the observed period. In FY23, the sector grew\
        \ steadily each quarter, with rates of 3.53%, 3.54%, 3.67%, and 3.90%. This\
        \ positive momentum continued into 2023-24, with growth rates of 4.25%, 4.19%,\
        \ and 3.74% in the first three quarters, respectively. This sustained demand\
        \ for housing and a resilient real estate market indicate robust sector performance,\
        \ even amid broader economic fluctuations affecting other industries. Easing\
        \ inflation outlook and the central bank's decision to reduce the policy rate\
        \ to 20.5% signal positive economic prospects for Pakistan. This move is expected\
        \ to stimulate economic growth, boost investor confidence, and significantly\
        \ benefit the real estate sector. Lower interest rates will make property\
        \ ownership more affordable, driving demand across residential, commercial,\
        \ and industrial markets. This positive outlook, coupled with improved consumer\
        \ purchasing power, is anticipated to contribute to overall economic development\
        \ and stability in Pakistan. THE RISE OF SMALL PROPERTIES: AN INSIDE STORY\
        \ ON PAKISTAN'S REAL ESTATE SECTOR REAL ESTATE PRICES ARE LIKELY TO REMAIN\
        \ ELEVATED Zameen.com State Bank of Pakistan Pakistan Institute of Development\
        \ Economics (PIDE) Pakistan Bureau of Statistics (PBS) HIES survey Demographic\
        \ Survey Federal Board of Revenue (FBR) Global Property Guide (GPG) Methodology\
        \ Property price data, sourced from zameen.com, was analyzed for various cities\
        \ across Pakistan. Due to the differing frequencies of data availability per\
        \ city, return calculations for small, medium, and large properties were based\
        \ on the segments where data existed for all three categories. This resulted\
        \ in some returns being calculated over 10 years, others over 9 years, and\
        \ some over as little as 3 years. To better understand real estate segmentation\
        \ and demand in Pakistan, properties are divided into three categories: Small\
        \ Properties: These typically range from 3 to 7 Marla in size and cater to\
        \ individuals or small families with budget constraints or those seeking starter\
        \ homes. 1. Medium Properties: Ranging from 10 to 15 Marla, these properties\
        \ are suitable for growing families or those seeking more space and amenities\
        \ than smaller properties offer. 2. Large Properties: Spanning from 1 to 2\
        \ Kanal, these properties cater to affluent individuals or large families\
        \ who desire spacious homes with luxurious amenities and ample outdoor space.\
        \ 3. This segmentation provides insights into the diverse needs and preferences\
        \ of property buyers in Pakistan, enabling a more targeted analysis of market\
        \ trends and demands across different property segments. THE RISE OF SMALL\
        \ PROPERTIES: AN INSIDE STORY ON PAKISTAN'S REAL ESTATE SECTOR DATA SOURCES\
