        \ ENVIRONMENT DATA SOURCES & METHODOLOGY Pakistan's house building sector\
        \ has experienced significant shifts in consumer financing. In FY19, the sector\
        \ accounted for 17% of total consumer financing, totaling PKR92.5 bn. This\
        \ share decreased to 15% in FY20, but rebounded in FY21 with financing rising\
        \ to PKR103.6 bn while maintaining its 15% share. The sector saw substantial\
        \ growth in FY22, with financing nearly doubling to PKR200 bn (22% of total\
        \ consumer financing), and continued to peak at PKR 212 bn (25% of the market)\
        \ in FY23. Although FY24 saw a slight decline in financing to PKR 204 bn,\
        \ the sector maintained its 25% market share, indicating potential market\
        \ stabilization after rapid growth. This growth is likely driven by favorable\
        \ government policies, low-interest rates, and increased housing demand for\
        \ small and large property segments. The Pakistan government's FY25 fiscal\
        \ budget introduces significant reforms to real estate taxation, aimed at\
        \ increasing revenue, curbing speculation, and enhancing transparency. Notable\
        \ changes include the elimination of the holding period for properties acquired\
        \ after July 1, 2024, and a flat 15% capital gains tax for Active Taxpayers\
        \ List (ATL) filers. Additionally, the budget introduces tax incentives for\
        \ sustainable development and affordable housing, such as rebates for green\
        \ building projects and tax credits for affordable housing developers. Real\
        \ Estate Investment Trusts (REITs) also benefit from favorable tax treatment.\
        \ These fiscal measures align with observed trends in Pakistan\u2019s real\
        \ estate market from 2012 to 2024, particularly in the growth of small and\
        \ medium property segments, driven by urbanization and middle-class demand.\
        \ The combination of new tax incentives and ongoing market trends suggests\
        \ strong potential for investment returns, especially in these segments. Pakistan's\
        \ property taxation system presents a mixed picture when compared to other\
        \ countries in the region. While its property tax rates (0.15% to 0.75% of\
        \ property value) are relatively low, making it competitive with nations like\
        \ India and Singapore, other aspects of its tax structure are less favorable.\
        \ Pakistan\u2019s 15% Capital Gains Tax (CGT) for filers is lower than China\u2019\
        s 20% but comparable to Bangladesh\u2019s rate. It\u2019s higher than India\u2019\
        s in some cases and less favorable than Singapore\u2019s 0% for properties\
        \ held for over three years. Stamp duty rates in Pakistan, ranging from 2%\
        \ to 5%, are comparable to other countries, but the addition of a unique Capital\
        \ Value Tax (CVT) at 2% of property value sets Pakistan apart and potentially\
        \ increases the overall tax burden on property transactions. When considering\
        \ the cumulative effect of various taxes and fees, including registration\
        \ fees and the CVT, Pakistan's overall taxation on property transactions may\
        \ be less attractive compared to some other countries in the region. Countries\
        \ like Singapore, Hong Kong, and the UAE offer certain tax advantages, such\
        \ as no capital gains tax for individuals in Singapore (for properties held\
        \ for at least 3 years) or the absence of federal capital gains tax in the\
        \ UAE. However, it's important to note that each country's tax structure is\
        \ unique, and the impact on property owners and investors can vary based on\
        \ factors such as property values, holding periods, and individual circumstances.\
        \ ABSTRACT PAKISTAN'S REAL ESTATE TAXES AND TRENDS The 2024-25 fiscal budget,\
        \ as introduced through the Finance Act of 2024, represents a major shift\
        \ in Pakistan's real estate taxation framework. These reforms are aimed at\
        \ increasing revenue, curbing market speculation, and promoting transparency.\
        \ Key changes include the elimination of the holding period concept for properties\
        \ acquired on or after July 1, 2024. A flat 15% capital gains tax (CGT) now\
        \ applies to ATL (Active Taxpayers List) filers, while non-ATL filers face\
        \ higher progressive rates . For properties sold within a year, a 15% CGT\
        \ is imposed, with lower rates for longer holding periods depending on property\
        \ type. Rental income tax has also been standardized across all taxpayer categories,\
        \ with calculations based on net income after allowable deductions. Additional\
        \ reforms include a 50% reduction in stamp duty for affordable housing transactions\
        \ and property tax exemptions, with full exemption for units valued up to\
        \ PKR 2.5 million and a 50% reduction for properties valued between PKR 2.5-5\
        \ million. Withholding tax has been adjusted, reducing it from 2% to 1% for\
        \ properties held over three years, and eliminating it entirely for those\
        \ held more than 10 years. To encourage sustainable building practices, the\
        \ budget offers up to a 10% tax rebate for green projects meeting LEED certification\
        \ standards and developer tax credits up to 15% of project costs for affordable\
        \ housing developments. Real Estate Investment Trusts (REITs) benefit from\
        \ tax-exempt dividend income and a reduced corporate tax rate of 15%. Additionally,\
        \ land transfer tax has been reduced by 25% for properties transferred within\
        \ family members. These reforms aim to stimulate growth in the real estate\
        \ sector, encourage long-term investment, and support sustainable development.\
        \ However, the full impact of these changes on market dynamics remains to\
        \ be seen. PAKISTAN'S FISCAL BUDGET 2024-25: A PARADIGM SHIFT IN REAL ESTATE\
        \ TAXATION PAKISTAN'S REAL ESTATE TAXES AND TRENDS TAX CATEGORY DETAILS 1.Capital\
        \ Gains Tax General Rule: 15% tax if sold within 1 year of purchase for all\
        \ property types (open plots, constructed properties, flats). Open Plots:\
        \ \u2022 12.5% (1-2 years) \u2022 10% (2-3 years) \u2022 7.5% (3-4 years)\
        \ \u2022 5% (4-5 years) \u2022 2.5% (5-6 years) \u2022 0% (over 6 years) Constructed\
        \ Properties: \u2022 10% (1-2 years) \u2022 7.5% (2-3 years) \u2022 5% (3-4\
        \ years) \u2022 0% (over 4 years) Flats: \u2022 7.5% (1-2 years) \u2022 0%\
        \ (over 2 years) 2. Rental Income Tax Uniform Taxation: Same tax rates for\
        \ all taxpayers (individuals and AOPs). Net Income Basis: Tax calculated on\
        \ income after allowable deductions (up to 4% of gross receipts). Withholding\
        \ Tax (WHT) Rates: \u2022 0% (income up to PKR 300,000) \u2022 5% (PKR 300,001\
        \ - 600,000) \u2022 10% (PKR 600,001 - 2,000,000) \u2022 25% (over PKR 2,000,000).\
        \ \u2022 Rates double if the recipient is not an active taxpayer. QUANTITATIVE\
