        \ AND TRENDS To understand the impact of these tax reforms, it's crucial to\
        \ analyze the historical trends in Pakistan's real estate market across different\
        \ property segments. Small Properties (3 Marla - 5 Marla & 7 Marla): A dramatic\
        \ 80% surge in 2012 was followed by significant fluctuations, with notable\
        \ peaks in 2014 and 2023 at 49% and 23%, respectively. However, the market\
        \ also experienced periods of minimal growth, including a dip to just 1% in\
        \ 2017. Despite this volatility, the trend points to a resilient market for\
        \ small properties, with consistent price increases in recent years, culminating\
        \ in a projected 11% rise for 2024. The overall compound annual growth rate\
        \ (CAGR) for the period from 2012 to 2024 is 17.79%, reflecting substantial\
        \ average annual growth. A closer look reveals distinct phases: a high- growth\
        \ period from 2012 to 2017 with a CAGR of 27.05%, followed by a more moderate\
        \ growth phase from 2017 to 2024, with a CAGR of 9.05%. This analysis highlights\
        \ the dynamic nature of Pakistan's small property market, marked by periods\
        \ of rapid expansion and phases of consolidation. Medium Properties (10 Marla\
        \ - 15 Marla): The analysis for medium properties reveals a similar pattern\
        \ of volatility, but with a notably lower overall CAGR of 11.55% compared\
        \ to small properties. The period from 2012 to 2017 saw a CAGR of 17.38%,\
        \ indicating robust growth, while the subsequent period from 2017 to 2024\
        \ experienced a significant slowdown with a CAGR of only 5.91%. This suggests\
        \ that while the market for medium properties has also seen appreciation,\
        \ it has been less dynamic and more susceptible to market fluctuations compared\
        \ to the small property segment. Large Properties (1 Kanal - 2 Kanal): The\
        \ market for large properties has displayed significant volatility over the\
        \ past decade. After experiencing robust growth from 2012 to 2016, with rates\
