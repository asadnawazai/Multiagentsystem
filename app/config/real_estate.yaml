        \ TAXATION MEASURES ON REAL-ESTATE PAKISTAN'S REAL ESTATE TAXES AND TRENDS\
        \ To understand Pakistan's new tax structure in a global context, we've conducted\
        \ a comparative analysis with seven other countries: India, China, Singapore,\
        \ Hong Kong, Bangladesh, UAE, and Malaysia. This comparison reveals significant\
        \ variations in real estate tax structures across these markets. Property\
        \ Tax: Pakistan's property tax rates of 0.15% to 0.75% of property value are\
        \ generally more competitive compared to other countries in the region. These\
        \ rates are lower than India's 5% to 20% of annual rental value and Singapore's\
        \ 4% to 32% of annual value. They're also comparable to or lower than China's\
        \ 0.4% to 1.2% for residential properties and Bangladesh's varying rates of\
        \ 0.3% to 4%. Pakistan's straightforward system based on property value, rather\
        \ than rental income, potentially makes it more attractive for property ownership\
        \ from a tax perspective, though overall property costs involve other factors\
        \ beyond just property tax. Capital Gains Tax: Pakistan's capital gains tax\
        \ on property, set at 15% for filers and 45% for non-filers, presents a mixed\
        \ picture when compared to other countries in the region. This rate is higher\
        \ than Singapore's 0% for properties held for at least 3 years and Hong Kong's\
        \ non- applicable status for individuals. It's also more complex than China's\
        \ flat 20% rate. However, it's potentially more favorable than India's system,\
        \ which uses income tax slab rates for short-term gains and 20% or 12.5% for\
        \ long-term gains. The UAE's lack of federal capital gains tax for individuals\
        \ makes it more attractive in this aspect. Malaysia's recent introduction\
        \ of a 10% rate for residents is lower than Pakistan's rate for filers. Overall,\
        \ Pakistan's capital gains tax structure, particularly for non-filers, could\
        \ be seen as less competitive compared to some regional counterparts, potentially\
        \ impacting its attractiveness for property investment. Stamp Duty: Pakistan's\
        \ stamp duty on property transactions, ranging from 2% to 5% of property value\
        \ or circle rate (whichever is higher), is generally competitive within the\
        \ region. This rate is lower than India's 3% to 8% and comparable to Singapore's\
        \ tiered system of 3% to 4%. It's significantly higher than China's 0.05%\
        \ for residential properties, but lower than Bangladesh's rates of 4.5% for\
        \ larger apartments and 5% for land. The UAE's rates of 2% to 4% are similar\
        \ to Pakistan's. Hong Kong's system, which varies based on property value\
        \ and buyer status, can be higher for non-residents and corporate buyers.\
        \ Malaysia's 1% to 4% range is comparable to Pakistan's. Overall, Pakistan's\
        \ stamp duty rates fall within the mid-range for the region, making them neither\
        \ a strong deterrent nor a significant advantage for property transactions\
        \ compared to most neighboring countries. Registration Fee: Pakistan's registration\
        \ fee for property transactions, ranging from 0.25% to 1% of property value\
        \ depending on the province, presents a mixed picture when compared to other\
        \ countries in the region. This fee structure puts Pakistan at a disadvantage\
        \ compared to China and Singapore, where no registration fees are applicable.\
        \ However, it remains REAL ESTATE TAXATION ACROSS BORDERS PAKISTAN'S REAL\
        \ ESTATE TAXES AND TRENDS competitive with India's 1% of the total value of\
        \ the Sale Deed plus a small fixed charge, and Bangladesh's flat 1% of property\
        \ value. Pakistan's rates are generally higher than Hong Kong's 0.03% to 0.06%,\
        \ but potentially lower than Malaysia's 1% of property value or RM 100, whichever\
        \ is greater. The absence of registration fees in China and Singapore could\
        \ make these markets more attractive for property transactions from this specific\
        \ cost perspective, potentially putting Pakistan at a slight disadvantage\
        \ in regional property investment competitiveness. Capital Value Tax (CVT):\
        \ Pakistan's Capital Value Tax (CVT) of 2% on property value is unique in\
        \ the region, as other major South and Southeast Asian economies do not impose\
        \ a similar tax. This additional cost on property transactions could put Pakistan\
        \ at a competitive disadvantage in attracting real estate investment. The\
        \ CVT, combined with other property-related taxes and fees, increases the\
        \ overall expense of property dealings in Pakistan. This distinctive tax burden\
