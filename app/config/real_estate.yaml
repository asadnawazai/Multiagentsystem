        \ GLOBAL BENCHMARKS AND LOCAL REALITIES: PAKISTAN\u2019S 2024-25 REAL ESTATE\
        \ TAX REFORMS PAKISTAN'S FISCAL BUDGET 2024-25: A PARADIGM SHIFT IN REAL ESTATE\
        \ TAXATION QUANTITATIVE TAXATION MEASURES ON REAL ESTATE REAL ESTATE TAXATION\
        \ ACROSS BORDERS REAL ESTATE PRICES 2012-2024: A DEEP DIVE INTO EACH PROPERTY\
        \ SEGMENT DOMESTIC TRENDS, ECONOMIC SHIFTS, AND INVESTMENT ENVIRONMENT DATA\
        \ SOURCES & METHODOLOGY Pakistan's house building sector has experienced significant\
        \ shifts in consumer financing. In FY19, the sector accounted for 17% of total\
        \ consumer financing, totaling PKR92.5 bn. This share decreased to 15% in\
        \ FY20, but rebounded in FY21 with financing rising to PKR103.6 bn while maintaining\
        \ its 15% share. The sector saw substantial growth in FY22, with financing\
        \ nearly doubling to PKR200 bn (22% of total consumer financing), and continued\
        \ to peak at PKR 212 bn (25% of the market) in FY23. Although FY24 saw a slight\
        \ decline in financing to PKR 204 bn, the sector maintained its 25% market\
        \ share, indicating potential market stabilization after rapid growth. This\
        \ growth is likely driven by favorable government policies, low-interest rates,\
        \ and increased housing demand for small and large property segments. The\
        \ Pakistan government's FY25 fiscal budget introduces significant reforms\
        \ to real estate taxation, aimed at increasing revenue, curbing speculation,\
        \ and enhancing transparency. Notable changes include the elimination of the\
        \ holding period for properties acquired after July 1, 2024, and a flat 15%\
        \ capital gains tax for Active Taxpayers List (ATL) filers. Additionally,\
        \ the budget introduces tax incentives for sustainable development and affordable\
        \ housing, such as rebates for green building projects and tax credits for\
        \ affordable housing developers. Real Estate Investment Trusts (REITs) also\
        \ benefit from favorable tax treatment. These fiscal measures align with observed\
        \ trends in Pakistan\u2019s real estate market from 2012 to 2024, particularly\
        \ in the growth of small and medium property segments, driven by urbanization\
        \ and middle-class demand. The combination of new tax incentives and ongoing\
        \ market trends suggests strong potential for investment returns, especially\
        \ in these segments. Pakistan's property taxation system presents a mixed\
        \ picture when compared to other countries in the region. While its property\
        \ tax rates (0.15% to 0.75% of property value) are relatively low, making\
        \ it competitive with nations like India and Singapore, other aspects of its\
        \ tax structure are less favorable. Pakistan\u2019s 15% Capital Gains Tax\
        \ (CGT) for filers is lower than China\u2019s 20% but comparable to Bangladesh\u2019\
        s rate. It\u2019s higher than India\u2019s in some cases and less favorable\
        \ than Singapore\u2019s 0% for properties held for over three years. Stamp\
        \ duty rates in Pakistan, ranging from 2% to 5%, are comparable to other countries,\
        \ but the addition of a unique Capital Value Tax (CVT) at 2% of property value\
        \ sets Pakistan apart and potentially increases the overall tax burden on\
        \ property transactions. When considering the cumulative effect of various\
        \ taxes and fees, including registration fees and the CVT, Pakistan's overall\
        \ taxation on property transactions may be less attractive compared to some\
        \ other countries in the region. Countries like Singapore, Hong Kong, and\
        \ the UAE offer certain tax advantages, such as no capital gains tax for individuals\
        \ in Singapore (for properties held for at least 3 years) or the absence of\
        \ federal capital gains tax in the UAE. However, it's important to note that\
        \ each country's tax structure is unique, and the impact on property owners\
        \ and investors can vary based on factors such as property values, holding\
        \ periods, and individual circumstances. ABSTRACT PAKISTAN'S REAL ESTATE TAXES\
        \ AND TRENDS The 2024-25 fiscal budget, as introduced through the Finance\
        \ Act of 2024, represents a major shift in Pakistan's real estate taxation\
        \ framework. These reforms are aimed at increasing revenue, curbing market\
        \ speculation, and promoting transparency. Key changes include the elimination\
        \ of the holding period concept for properties acquired on or after July 1,\
        \ 2024. A flat 15% capital gains tax (CGT) now applies to ATL (Active Taxpayers\
        \ List) filers, while non-ATL filers face higher progressive rates . For properties\
        \ sold within a year, a 15% CGT is imposed, with lower rates for longer holding\
        \ periods depending on property type. Rental income tax has also been standardized\
        \ across all taxpayer categories, with calculations based on net income after\
        \ allowable deductions. Additional reforms include a 50% reduction in stamp\
        \ duty for affordable housing transactions and property tax exemptions, with\
        \ full exemption for units valued up to PKR 2.5 million and a 50% reduction\
        \ for properties valued between PKR 2.5-5 million. Withholding tax has been\
        \ adjusted, reducing it from 2% to 1% for properties held over three years,\
        \ and eliminating it entirely for those held more than 10 years. To encourage\
        \ sustainable building practices, the budget offers up to a 10% tax rebate\
        \ for green projects meeting LEED certification standards and developer tax\
        \ credits up to 15% of project costs for affordable housing developments.\
        \ Real Estate Investment Trusts (REITs) benefit from tax-exempt dividend income\
        \ and a reduced corporate tax rate of 15%. Additionally, land transfer tax\
        \ has been reduced by 25% for properties transferred within family members.\
        \ These reforms aim to stimulate growth in the real estate sector, encourage\
        \ long-term investment, and support sustainable development. However, the\
        \ full impact of these changes on market dynamics remains to be seen. PAKISTAN'S\
        \ FISCAL BUDGET 2024-25: A PARADIGM SHIFT IN REAL ESTATE TAXATION PAKISTAN'S\
        \ REAL ESTATE TAXES AND TRENDS TAX CATEGORY DETAILS 1.Capital Gains Tax General\
        \ Rule: 15% tax if sold within 1 year of purchase for all property types (open\
        \ plots, constructed properties, flats). Open Plots: \u2022 12.5% (1-2 years)\
        \ \u2022 10% (2-3 years) \u2022 7.5% (3-4 years) \u2022 5% (4-5 years) \u2022\
        \ 2.5% (5-6 years) \u2022 0% (over 6 years) Constructed Properties: \u2022\
        \ 10% (1-2 years) \u2022 7.5% (2-3 years) \u2022 5% (3-4 years) \u2022 0%\
        \ (over 4 years) Flats: \u2022 7.5% (1-2 years) \u2022 0% (over 2 years) 2.\
        \ Rental Income Tax Uniform Taxation: Same tax rates for all taxpayers (individuals\
        \ and AOPs). Net Income Basis: Tax calculated on income after allowable deductions\
        \ (up to 4% of gross receipts). Withholding Tax (WHT) Rates: \u2022 0% (income\
        \ up to PKR 300,000) \u2022 5% (PKR 300,001 - 600,000) \u2022 10% (PKR 600,001\
        \ - 2,000,000) \u2022 25% (over PKR 2,000,000). \u2022 Rates double if the\
        \ recipient is not an active taxpayer. QUANTITATIVE TAXATION MEASURES ON REAL-ESTATE\
        \ PAKISTAN'S REAL ESTATE TAXES AND TRENDS TAX CATEGORY DETAILS Sub-leases:\
        \ WHT rules apply to all rental payments, including sub- leases. Loss Offset:\
        \ Losses from property income can be offset against other income under this\
        \ heading. 3. Stamp Duty Affordable Housing: 50% reduction for transactions\
        \ involving affordable housing units (valued up to PKR 2.5 million). Other\
        \ Property Transactions: No changes. 4. Property Tax Affordable Housing Projects:\
        \ Full exemption on property tax for units valued up to PKR 2.5 million. Mid-Range\
        \ Housing Projects: 50% reduction in property tax for units valued between\
        \ PKR 2.5 million and PKR 5 million. Luxury Properties: No change in property\
        \ tax rates for properties valued above PKR 5 million. 5. Withholding Tax\
        \ on Property Revisions for Property Transactions: \u2022 Reduced from 2%\
        \ to 1% for properties held for more than 3 years. \u2022 No withholding tax\
        \ for properties held for more than 10 years. 6. Tax Incentives for Green\
        \ Buildings Incentives for Sustainable Development: \u2022 Up to 10% tax rebates\
        \ for projects meeting LEED certification standards or equivalent. \u2022\
        \ Additional deductions for expenses related to sustainable technologies,\
        \ such as solar panels and rainwater harvesting systems. 7. Tax Credits for\
        \ Developers Affordable Housing Development: \u2022 Tax credits of up to 15%\
        \ of the project cost for developers engaged in affordable housing projects.\
        \ \u2022 Additional credits for developers incorporating green building practices.\
        \ QUANTITATIVE TAXATION MEASURES ON REAL-ESTATE PAKISTAN'S REAL ESTATE TAXES\
        \ AND TRENDS TAX CATEGORY DETAILS 8. Tax Treatment for REITs Favorable Tax\
        \ Treatment: \u2022 Dividend income from REITs exempt from tax to encourage\
        \ investment in real estate through this vehicle. \u2022 Reduced corporate\
        \ tax rate for REITs set at 15%, compared to the standard corporate tax rate.\
        \ 9. Land Transfer Tax Adjustments for Family Transfers: \u2022 25% reduction\
        \ in land transfer tax for properties transferred within family members. \u2022\
        \ No change for other property transfers. QUANTITATIVE TAXATION MEASURES ON\
        \ REAL-ESTATE PAKISTAN'S REAL ESTATE TAXES AND TRENDS To understand Pakistan's\
        \ new tax structure in a global context, we've conducted a comparative analysis\
        \ with seven other countries: India, China, Singapore, Hong Kong, Bangladesh,\
        \ UAE, and Malaysia. This comparison reveals significant variations in real\
        \ estate tax structures across these markets. Property Tax: Pakistan's property\
        \ tax rates of 0.15% to 0.75% of property value are generally more competitive\
        \ compared to other countries in the region. These rates are lower than India's\
        \ 5% to 20% of annual rental value and Singapore's 4% to 32% of annual value.\
        \ They're also comparable to or lower than China's 0.4% to 1.2% for residential\
        \ properties and Bangladesh's varying rates of 0.3% to 4%. Pakistan's straightforward\
        \ system based on property value, rather than rental income, potentially makes\
        \ it more attractive for property ownership from a tax perspective, though\
        \ overall property costs involve other factors beyond just property tax. Capital\
        \ Gains Tax: Pakistan's capital gains tax on property, set at 15% for filers\
        \ and 45% for non-filers, presents a mixed picture when compared to other\
        \ countries in the region. This rate is higher than Singapore's 0% for properties\
        \ held for at least 3 years and Hong Kong's non- applicable status for individuals.\
        \ It's also more complex than China's flat 20% rate. However, it's potentially\
        \ more favorable than India's system, which uses income tax slab rates for\
        \ short-term gains and 20% or 12.5% for long-term gains. The UAE's lack of\
        \ federal capital gains tax for individuals makes it more attractive in this\
        \ aspect. Malaysia's recent introduction of a 10% rate for residents is lower\
        \ than Pakistan's rate for filers. Overall, Pakistan's capital gains tax structure,\
        \ particularly for non-filers, could be seen as less competitive compared\
        \ to some regional counterparts, potentially impacting its attractiveness\
        \ for property investment. Stamp Duty: Pakistan's stamp duty on property transactions,\
        \ ranging from 2% to 5% of property value or circle rate (whichever is higher),\
        \ is generally competitive within the region. This rate is lower than India's\
        \ 3% to 8% and comparable to Singapore's tiered system of 3% to 4%. It's significantly\
        \ higher than China's 0.05% for residential properties, but lower than Bangladesh's\
        \ rates of 4.5% for larger apartments and 5% for land. The UAE's rates of\
        \ 2% to 4% are similar to Pakistan's. Hong Kong's system, which varies based\
        \ on property value and buyer status, can be higher for non-residents and\
        \ corporate buyers. Malaysia's 1% to 4% range is comparable to Pakistan's.\
        \ Overall, Pakistan's stamp duty rates fall within the mid-range for the region,\
        \ making them neither a strong deterrent nor a significant advantage for property\
        \ transactions compared to most neighboring countries. Registration Fee: Pakistan's\
        \ registration fee for property transactions, ranging from 0.25% to 1% of\
        \ property value depending on the province, presents a mixed picture when\
        \ compared to other countries in the region. This fee structure puts Pakistan\
        \ at a disadvantage compared to China and Singapore, where no registration\
        \ fees are applicable. However, it remains REAL ESTATE TAXATION ACROSS BORDERS\
        \ PAKISTAN'S REAL ESTATE TAXES AND TRENDS competitive with India's 1% of the\
        \ total value of the Sale Deed plus a small fixed charge, and Bangladesh's\
        \ flat 1% of property value. Pakistan's rates are generally higher than Hong\
        \ Kong's 0.03% to 0.06%, but potentially lower than Malaysia's 1% of property\
        \ value or RM 100, whichever is greater. The absence of registration fees\
        \ in China and Singapore could make these markets more attractive for property\
        \ transactions from this specific cost perspective, potentially putting Pakistan\
        \ at a slight disadvantage in regional property investment competitiveness.\
        \ Capital Value Tax (CVT): Pakistan's Capital Value Tax (CVT) of 2% on property\
        \ value is unique in the region, as other major South and Southeast Asian\
        \ economies do not impose a similar tax. This additional cost on property\
        \ transactions could put Pakistan at a competitive disadvantage in attracting\
        \ real estate investment. The CVT, combined with other property-related taxes\
        \ and fees, increases the overall expense of property dealings in Pakistan.\
        \ This distinctive tax burden may make Pakistan's real estate market less\
        \ attractive compared to neighboring countries, potentially impacting its\
        \ position in the regional property investment market. Pakistan's property\
        \ taxation system presents a mixed picture compared to its regional counterparts.\
        \ While it offers competitive property tax rates, its capital gains tax structure\
        \ is less favorable, especially for non-filers. Stamp duty and registration\
        \ fees are generally mid-range, but the unique Capital Value Tax adds an extra\
        \ burden. Overall, Pakistan's multi-layered property taxation may reduce its\
        \ attractiveness for real estate investment compared to some neighboring countries,\
        \ despite having advantages in certain individual tax categories. PAKISTAN'S\
