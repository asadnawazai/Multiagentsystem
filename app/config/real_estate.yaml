        \ against major currencies, has made real estate an increasingly attractive\
        \ option for overseas Pakistanis and foreign investors, potentially driving\
        \ up prices in specific segments. However, this year rupee remains largely\
        \ unchanged against other currencies which also impacted real estate prices.\
        \ Moreover, the State Bank of Pakistan's policy rate increase to 22% in 2023\
        \ amid higher inflation has made mortgages more expensive, potentially slowing\
        \ down market activity. Economic uncertainty has also contributed to cautious\
        \ investor sentiment, with many adopting a 'wait-and-see' approach before\
        \ making significant investments. Pakistan's real estate market stands at\
        \ a crossroads, with recent tax reforms poised to significantly reshape the\
        \ sector. While challenges exist, particularly in terms of short-term market\
