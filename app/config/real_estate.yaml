        \ in property tax for units valued between PKR 2.5 million and PKR 5 million.\
        \ Luxury Properties: No change in property tax rates for properties valued\
        \ above PKR 5 million. 5. Withholding Tax on Property Revisions for Property\
        \ Transactions: \u2022 Reduced from 2% to 1% for properties held for more\
        \ than 3 years. \u2022 No withholding tax for properties held for more than\
