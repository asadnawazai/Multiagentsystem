        \ OF SMALL PROPERTIES: AN INSIDE STORY ON PAKISTAN'S REAL ESTATE SECTOR Pakistan's\
        \ real estate market is defying expectations, showcasing a dramatic shift\
        \ in demand towards smaller properties amid economic challenges. Despite the\
        \ economic hardship making homeownership increasingly difficult for many,\
        \ prices for small properties have surged, while larger homes are becoming\
        \ less desirable. Pakistan is home to a population of ~241 million, with an\
        \ annual growth rate of 2.55%. Of this population, 61.18% live in rural areas,\
        \ while the remaining 38.82% reside in urban areas. Reportedly, there are\
        \ approximately 19.2 million housing units in Pakistan with ~38 million households\
        \ and an average household size of approximately 6.3. Among these, 68% consist\
        \ of 1- 2 rooms (small homes), 24.43% consist of 3-4 rooms (mid-sized homes),\
        \ and only 6.92% consist of 5 or more rooms (large homes). This distribution\
        \ indicates that the demand for small homes is significantly higher across\
        \ Pakistan. Skyrocketing inflation rates, averaging 24.5% in FY24 till date,\
        \ and interest rates peaking at 22%, have significantly eroded the purchasing\
        \ power of Pakistan's middle class. These economic strains are likely driving\
        \ middle-income buyers towards more affordable, smaller properties, as securing\
        \ mortgages for larger homes becomes increasingly difficult. This demand shift\
        \ helps explain the exceptional growth seen in the small property segment.\
        \ Similarly, Over the past 10-years, small properties in Pakistan have experienced\
        \ astonishing price growth, increasing by 195%. This contrasts sharply with\
        \ the performance of mid-sized properties, which have underperformed during\
        \ the same period. This significant divergence highlights a complex interplay\
        \ between property size, economic pressures, and shifting demand patterns\
        \ within Pakistan's real estate market. While middle-income groups grapple\
        \ with affordability challenges, other market segments tell a different story.\
        \ Investors with greater financial resources are less sensitive to higher\
        \ interest rates and may see inflation and rupee devaluation as a strong reason\
        \ to invest in real estate as a tangible asset. Additionally, the steady flow\
        \ of remittances from overseas Pakistanis often fuels investment in property,\
        \ especially in the luxury housing sector. Understanding how these wealthier\
        \ segments are responding to current economic conditions provides a more holistic\
        \ view of the market dynamics. Across Pakistan's major cities, small properties\
        \ have consistently outperformed medium and large properties. Cities like\
        \ Karachi, Islamabad, Lahore, Rawalpindi, Faisalabad, Peshawar, Multan, Gujranwala,\
        \ and Sialkot have all witnessed significant growth in small property returns.\
        \ Medium and large properties have shown moderate and steady appreciation,\
        \ with some fluctuations noted in certain cities. This trend indicates a strong\
        \ preference and higher returns for small properties, making them the engine\
        \ of growth in the country's real estate sector. THE RISE OF SMALL PROPERTIES:\
